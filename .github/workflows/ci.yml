# Checks every push and pull request (typecheck, build, a smoke test on simulated engines), then publishes the
# container image for amd64 and arm64 to ghcr.io/analitikisler/ai-visibility from main and from version tags (v*).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc -p deploy/cloudflare/tsconfig.json
      - run: npm run build
      - name: Smoke test (no API keys, so every engine is simulated)
        env:
          DATA_DIR: ${{ runner.temp }}/data
          PORT: '4400'
        run: |
          npm start > "$RUNNER_TEMP/server.log" 2>&1 &
          trap 'status=$?; [ "$status" -eq 0 ] || cat "$RUNNER_TEMP/server.log"' EXIT
          base=http://localhost:4400
          for i in $(seq 1 60); do curl -sf "$base/api/health" > /dev/null && break; sleep 1; done
          curl -sf "$base/api/health"
          curl -sf "$base/" | grep -q '<title>ai visibility</title>'
          project=$(curl -sf -X POST "$base/api/demo/seed" | jq -r .id)
          for endpoint in overview prompt-stats sources responses diagnose recommendations report crawlers/overview referrals/overview integration; do
            curl -sf -o /dev/null "$base/api/projects/$project/$endpoint" || { echo "GET $endpoint failed"; exit 1; }
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: example.com' "$base/api/projects")" = 403
          echo "smoke test passed"

  image:
    name: Publish image
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=ai visibility
            org.opencontainers.image.description=Shows how AI assistants describe a brand, why competitors get picked instead, and what to change.
            org.opencontainers.image.vendor=Analitik İşler
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
